name: Windows desktop test
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test data and native WPF views
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\Test.ps1
      - name: Render the WPF demo
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\Start.ps1 -SmokeTest -PreviewPath "$pwd\dashboard.png"
      - uses: actions/upload-artifact@v4
        with:
          name: soccer-dashboard
          path: dashboard.png
          retention-days: 7
